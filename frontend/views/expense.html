<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button style="right: 10px; position: absolute;" ><a href="../views/pay.html">Buy premium membership</a></button>
    <form action="" method="post">
     <label for="expAmt">Choose Expense Amount:</label>
        <input type="number" id="expAmt" name="expAmt" required><br><br>
        <label for="expDes">Choose Description:</label>
        <input type="text" id="expDes" name="expDes" required><br><br>
        <label for="expCat">Choose Category:</label>
        <select id="expCat" name="expCat" required>
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
        </select><br><br>
        <button type="submit">Add Expense</button>
    </form>

    <ul id="expenseList"></ul>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../script/expense.js"></script>

</body>
</html>
